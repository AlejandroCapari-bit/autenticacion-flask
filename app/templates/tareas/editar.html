{% extends "base.html" %}

{% block content %}
<h2>✏️ Editar Tarea</h2>
<form method="POST">
    <div class="mb-3">
        <label>Descripción:</label>
        <input type="text" name="descripcion" value="{{ tarea.descripcion }}" class="form-control" required>
    </div>
    <div class="mb-3 form-check">
        <input type="checkbox" name="completado" class="form-check-input" {% if tarea.completado %}checked{% endif %}>
        <label class="form-check-label">Completado</label>
    </div>
    <button type="submit" class="btn btn-primary">💾 Guardar</button>
    <a href="/tareas" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
