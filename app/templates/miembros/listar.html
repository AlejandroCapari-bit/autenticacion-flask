{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>👥 Listado de Miembros</h2>
    <a href="/miembros/crear" class="btn btn-success">+ Nuevo Miembro</a>
</div>

<table class="table table-striped table-bordered">
    <thead class="table-primary">
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Email</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% for miembro in miembros %}
        <tr>
            <td>{{ miembro.id }}</td>
            <td>{{ miembro.nombre }}</td>
            <td>{{ miembro.email or 'No especificado' }}</td>
            <td>
                <a href="/miembros/editar/{{ miembro.id }}" class="btn btn-warning btn-sm">✏️ Editar</a>
                <a href="/miembros/eliminar/{{ miembro.id }}" class="btn btn-danger btn-sm" onclick="return confirm('¿Eliminar este miembro?')">🗑️ Eliminar</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
