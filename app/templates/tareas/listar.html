{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>✅ Listado de Tareas</h2>
    <a href="/tareas/crear" class="btn btn-success">+ Nueva Tarea</a>
</div>

<table class="table table-striped table-bordered">
    <thead class="table-primary">
        <tr>
            <th>ID</th>
            <th>Descripción</th>
            <th>Completado</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% for tarea in tareas %}
        <tr>
            <td>{{ tarea.id }}</td>
            <td>{{ tarea.descripcion }}</td>
            <td>{% if tarea.completado %}✅ Sí{% else %}❌ No{% endif %}</td>
            <td>
                <a href="/tareas/editar/{{ tarea.id }}" class="btn btn-warning btn-sm">✏️ Editar</a>
                <a href="/tareas/eliminar/{{ tarea.id }}" class="btn btn-danger btn-sm" onclick="return confirm('¿Eliminar esta tarea?')">🗑️ Eliminar</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
